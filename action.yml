name: Warmbuild
description: Remote compilation cache for Xcode 26+. Add this step before xcodebuild; nothing else changes.
branding:
  icon: zap
  color: orange
inputs:
  url:
    description: Cache API URL
    required: false
    default: https://warmbuild-cache-dev.mikitahimpel.com
  token:
    description: "A Warmbuild API token, for runners without GitHub OIDC. Leave empty on GitHub-hosted runners (the job needs `permissions: id-token: write`)."
    required: false
    default: ""
  workspace:
    description: The checkout whose paths are mapped to /tmp/warmbuild/src. Set it when the repository is checked out below the workspace (actions/checkout `path:`).
    required: false
    default: ""
  report:
    description: "'false' skips the CI report: where the job's time went, read from Xcode's build logs and result bundles in the post step (names, durations, counts and sizes; never source or logs)."
    required: false
    default: "true"
  report-budget:
    description: "Seconds the CI report may spend reading result bundles (xcresulttool) in the post step. What does not fit is skipped and the report says so. On a runner whose Simulator is still busy, xcresulttool can take minutes to start; shut the Simulator down after the tests (xcrun simctl shutdown all) or raise this."
    required: false
    default: "90"
  select-tests:
    description: "'true' selects the tests a pull request can reach (see outputs); pushes and other events run everything. Pass `$WARMBUILD_ONLY_TESTING` to `xcodebuild test`."
    required: false
    default: "false"
  select-tests-ignore:
    description: Changed paths that never affect tests, one regular expression per line (documentation and tooling are ignored already)
    required: false
    default: ""
  select-tests-always:
    description: Test targets or Target/Suite ids to run on every pull request, one per line
    required: false
    default: ""
  select-tests-scheme:
    description: "The scheme `xcodebuild test` runs: -only-testing names only its test targets, read from project.yml or the shared .xcscheme (default: every test target of the project). Swift package test targets go to swift-filter."
    required: false
    default: ""
  select-tests-sample:
    description: Share of the other test files to run anyway, so every test runs on some pull requests
    required: false
    default: "0.05"
outputs:
  enabled:
    description: "'true' when the cache server runs and xcodebuild uses it"
  xcconfig:
    description: The xcconfig with the cache settings (also exported as XCODE_XCCONFIG_FILE)
  stats:
    description: Path of the JSON file with the server's counters, updated while the job runs
  tests:
    description: "With select-tests: 'all', 'some' or 'none' for xcodebuild (none: nothing the change reaches is in the project; skip the test step or pass only-testing, which skips every target)"
  only-testing:
    description: With select-tests, the -only-testing / -skip-testing arguments for xcodebuild, naming only the project's test targets (empty when everything runs); also in WARMBUILD_ONLY_TESTING
  swift-filter:
    description: With select-tests, a `swift test --filter` pattern for the selected tests (empty when everything runs)
runs:
  using: node24
  main: action/main.mjs
  post: action/post.mjs
